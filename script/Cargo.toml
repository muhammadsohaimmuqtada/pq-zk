[package]
version = "0.1.0"
name = "pq-zk-script"
edition = "2021"
default-run = "pq-zk"

[[bin]]
name = "pq-zk"
path = "src/bin/main.rs"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking", "native-gnark"] }
# sp1-prover 6.8.1 uses TempDir::keep() which the template's stale lockfile (tempfile 3.19.1) lacks — force the newest 3.x
tempfile = "=3.27.0"
clap = { version = "4.0", features = ["derive", "env"] }
hex = "0.4.3"
alloy-sol-types = { workspace = true }
pq-zk-lib = { path = "../lib" }
dotenv = "0.15.0"

[build-dependencies]
sp1-build = { version = "6.0.1" }
